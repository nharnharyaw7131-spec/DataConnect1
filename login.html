<!DOCTYPE html> 
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Log in to your DataConnect GH account to manage your data shop and earnings.">
    <title>Log In - DataConnect GH</title>

    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="./style.css">

    <style>
        /* Form-specific layout tweaks */
        .auth-container {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 15px;
        }

        .auth-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 40px 30px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-header h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
        }

        .auth-header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--secondary-color);
            font-size: 0.9rem;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            font-size: 1rem;
            color: var(--text-main);
            outline: none;
            transition: var(--transition);
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .form-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 0.85rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
        }

        .forgot-link {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .btn-full {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
        }

        .auth-footer {
            text-align: center;
            margin-top: 25px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .auth-footer a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 700;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .back-home {
            text-align: center;
            margin-bottom: 20px;
        }

        .back-home a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-home a:hover {
            color: var(--primary-color);
        }
    </style>
</head>

<body>

    <!-- Simple Header Navigation -->
    <header class="main-header">
        <nav class="nav-bar container">
            <a href="index.html" class="brand-logo">DataConnect</a>
            <a href="signup.html" class="btn btn-secondary">Sign Up</a>
        </nav>
    </header>

    <!-- MAIN LOGIN FORM AREA -->
    <main class="auth-container">
        <div class="auth-card">

            <div class="back-home">
                <a href="index.html">&larr; Back to Home</a>
            </div>

            <div class="auth-header">
                <h1>Welcome Back</h1>
                <p>Log in to access your vendor dashboard</p>
            </div>

            <form action="/login" method="POST">
                
                <!-- Phone / Email -->
                <div class="form-group">
                    <label for="login-id">Phone Number or Email</label>
                    <input type="text" id="login-id" name="login-id" class="form-control" placeholder="024XXXXXXX or name@example.com" required>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>

                <!-- Remember Me & Forgot Password -->
                <div class="form-actions">
                    <label class="remember-me">
                        <input type="checkbox" name="remember">
                        Remember me
                    </label>
                    <a href="#" class="forgot-link">Forgot Password?</a>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary btn-full">Log In &rarr;</button>

            </form>

            <div class="auth-footer">
                Don't have a data shop yet? <a href="signup.html">Create One Free</a>
            </div>

        </div>
    </main>

</body>

</html>
